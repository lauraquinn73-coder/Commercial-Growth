name = "commercial-growth-intelligence"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://commercialgrowth.ie,https://www.commercialgrowth.ie,http://localhost:8000,http://localhost:5500,http://127.0.0.1:8000"

# These rate limit bindings work on Cloudflare Workers (Wrangler >=4.36).
# Change namespace identifiers if you use them in another Worker in this account.
[[ratelimits]]
name = "SCANNER_CLIENT_LIMIT"
namespace_id = "7949531"
[ratelimits.simple]
limit = 8
period = 60

[[ratelimits]]
name = "SCANNER_GLOBAL_LIMIT"
namespace_id = "7949532"
[ratelimits.simple]
limit = 45
period = 60

# Live release also requires:
# npx.cmd wrangler secret put TURNSTILE_SECRET
# Do not put TURNSTILE_SECRET in this file or config.js.
